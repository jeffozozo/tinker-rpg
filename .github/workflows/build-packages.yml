name: Build downloadable packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Inno Setup
        if: matrix.target == 'windows'
        run: choco install innosetup --yes --no-progress
      - name: Build package
        run: python scripts/build_package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'macos'
        with:
          name: Tinker-RPG-macos
          path: dist/Tinker-RPG-macos.dmg
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: Tinker-RPG-windows
          path: dist/Tinker-RPG-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.exe
